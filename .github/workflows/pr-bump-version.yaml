name: Reusable Bump Version Renovate

on:
  workflow_call:
    inputs:
      version_file:
        description: Path to the version file.
        required: false
        type: string
        default: version.txt
    secrets:
      token:
        required: true

jobs:
  bump-version:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.token }}

      - name: Read current version
        run: |
          VERSION=$(tr -d '[:space:]' < "${{ inputs.version_file }}")
          echo "Current version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Bump version inside PR
        run: |
          VERSION="${{ env.VERSION }}"
          VERSION_PART=$(echo "$VERSION" | awk -F. '{print NF}')

          if [[ $VERSION_PART -ne 3 ]]; then
            echo "${{ inputs.version_file }} must contain a semantic version like major.minor.patch" >&2
            exit 1
          fi

          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          PATCH=${VERSION_PARTS[2]}
          PATCH=$((PATCH + 1))
          NEW_VERSION="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$PATCH"

          echo "New version: $NEW_VERSION"
          curl -sS https://raw.githubusercontent.com/Swaggeroo/ci-workflows/main/scripts/version-sync.sh | bash -s -- bump "$NEW_VERSION" "${{ inputs.version_file }}"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Commit new version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} inside PR [skip ci]"
          git push origin main
